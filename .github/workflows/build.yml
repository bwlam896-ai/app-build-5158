name: Build Web App Packages (APK & AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Web Directory & Wrapper
        run: |
          mkdir -p www
          cp -r $(ls -A | grep -vE '^.git|^.github|^www$') www/ || true
          npm init -y
          npm install --save @capacitor/core @capacitor/cli @capacitor/android
          npx --yes cap init "AppMaker" "com.appmaker.web" --web-dir "www"
          npx --yes cap add android
          npx --yes cap sync android

      - name: Compile Android APK and AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          ./gradlew bundleDebug || true

      - name: Upload APK Package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: 'android/app/build/outputs/apk/debug/*.apk'

      - name: Upload AAB Package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-aab
          path: 'android/app/build/outputs/bundle/debug/*.aab'
