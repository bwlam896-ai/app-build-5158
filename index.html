<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الأذكار - حصن المسلم الرقمي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Amiri & Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b'
                        },
                        amber: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706'
                        }
                    },
                    fontFamily: {
                        tajawal: ['Tajawal', 'sans-serif'],
                        amiri: ['Amiri', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .thikr-font {
            font-family: 'Amiri', serif;
            line-height: 2.2;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(16, 185, 129, 0.3);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(16, 185, 129, 0.6);
        }
        .card-completed {
            background-color: rgba(16, 185, 129, 0.08) !important;
            border-color: #10b981 !important;
        }
        .dark .card-completed {
            background-color: rgba(6, 78, 59, 0.3) !important;
            border-color: #047857 !important;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .pulse-animation {
            animation: pulse-ring 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <!-- App Logo & Title -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-xl shadow-lg shadow-emerald-600/30">
                    <i class="fa-solid fa-kaaba"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-emerald-800 dark:text-emerald-400">تطبيق الأذكار</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">أَلا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ</p>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center gap-2">
                <!-- Text Size Adjuster -->
                <button id="btn-font-size" onclick="toggleFontSizeModal()" class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition" title="حجم الخط">
                    <i class="fa-solid fa-font"></i>
                </button>
                
                <!-- Audio Sound Toggle -->
                <button id="btn-sound" onclick="toggleSound()" class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition" title="الصوت">
                    <i id="sound-icon" class="fa-solid fa-volume-high text-emerald-600"></i>
                </button>

                <!-- Dark Mode Toggle -->
                <button id="btn-theme" onclick="toggleDarkMode()" class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition" title="المظهر">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Font Size Modal -->
    <div id="font-modal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 w-full max-w-xs shadow-2xl border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-base">تعديل حجم خط الذكر</h3>
                <button onclick="toggleFontSizeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex items-center gap-4 my-4">
                <span class="text-sm">صغير</span>
                <input type="range" id="font-slider" min="18" max="36" step="2" value="22" oninput="changeFontSize(this.value)" class="w-full accent-emerald-600 cursor-pointer">
                <span class="text-xl font-bold">كبير</span>
            </div>
            <div class="text-center p-3 bg-slate-50 dark:bg-slate-700/50 rounded-xl">
                <p id="font-preview" class="thikr-font text-xl text-emerald-700 dark:text-emerald-400">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</p>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6">

        <!-- Search & Filter Bar -->
        <div class="mb-5 relative">
            <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="ابحث في الأذكار..." class="w-full pl-4 pr-11 py-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition text-sm">
            <button id="clear-search" onclick="clearSearch()" class="hidden absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-circle-xmark"></i>
            </button>
        </div>

        <!-- Navigation Tabs (Categories) -->
        <nav class="flex gap-2 overflow-x-auto pb-3 custom-scrollbar mb-6 -mx-4 px-4">
            <button onclick="switchCategory('morning')" id="tab-morning" class="tab-btn active px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 whitespace-nowrap transition shadow-sm bg-emerald-600 text-white">
                <i class="fa-solid fa-sun text-amber-300"></i> أذكار الصباح
            </button>
            <button onclick="switchCategory('evening')" id="tab-evening" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 whitespace-nowrap transition shadow-sm bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100">
                <i class="fa-solid fa-moon text-indigo-400"></i> أذكار المساء
            </button>
            <button onclick="switchCategory('after_prayer')" id="tab-after_prayer" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 whitespace-nowrap transition shadow-sm bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100">
                <i class="fa-solid fa-person-praying text-emerald-500"></i> أذكار الصلاة
            </button>
            <button onclick="switchCategory('sleep')" id="tab-sleep" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 whitespace-nowrap transition shadow-sm bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100">
                <i class="fa-solid fa-bed text-blue-400"></i> أذكار النوم
            </button>
            <button onclick="switchCategory('wake')" id="tab-wake" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 whitespace-nowrap transition shadow-sm bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100">
                <i class="fa-solid fa-cloud-sun text-amber-500"></i> الاستيقاظ
            </button>
            <button onclick="switchCategory('tasbeeh')" id="tab-tasbeeh" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 whitespace-nowrap transition shadow-sm bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100">
                <i class="fa-solid fa-fingerprint text-emerald-600"></i> المسبحة الإلكترونية
            </button>
            <button onclick="switchCategory('favorites')" id="tab-favorites" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 whitespace-nowrap transition shadow-sm bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100">
                <i class="fa-solid fa-bookmark text-amber-500"></i> المفضلة
            </button>
        </nav>

        <!-- Category Progress & Reset Controls (Hidden in Tasbeeh view) -->
        <div id="category-header-info" class="bg-white dark:bg-slate-800 rounded-2xl p-4 mb-6 shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="w-full sm:w-auto flex-1">
                <div class="flex justify-between items-center mb-2">
                    <span id="category-title" class="font-bold text-base text-emerald-800 dark:text-emerald-400">أذكار الصباح</span>
                    <span id="progress-text" class="text-xs font-bold text-slate-500 dark:text-slate-400">0 / 0 المكتمل</span>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-slate-100 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-emerald-600 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button onclick="resetCurrentCategory()" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 dark:bg-slate-700 hover:bg-rose-50 dark:hover:bg-rose-900/30 text-slate-600 dark:text-slate-300 hover:text-rose-600 rounded-lg transition flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate-right"></i> إعادة الضبط
                </button>
            </div>
        </div>

        <!-- Athkar List Container -->
        <div id="athkar-container" class="space-y-4">
            <!-- Cards will be dynamically inserted here -->
        </div>

        <!-- Electronic Tasbeeh Counter Container (Hidden by default) -->
        <div id="tasbeeh-container" class="hidden flex flex-col items-center justify-center py-6">
            <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 w-full max-w-md shadow-xl border border-slate-200 dark:border-slate-700 text-center flex flex-col items-center">
                
                <!-- Preset Selector -->
                <div class="w-full mb-6">
                    <label class="block text-xs font-semibold text-slate-400 mb-2">اختر الذكر للتسبيح</label>
                    <select id="tasbeeh-select" onchange="changeTasbeehPreset(this.value)" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl p-3 text-sm font-bold text-emerald-800 dark:text-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="سبحان الله">سُبْحَانَ اللَّهِ</option>
                        <option value="الحمد لله">الْحَمْدُ لِلَّهِ</option>
                        <option value="الله أكبر">اللَّهُ أَكْبَرُ</option>
                        <option value="لا إله إلا الله">لا إِلَهَ إِلا اللَّهُ</option>
                        <option value="أستغفر الله واتوب إليه">أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ</option>
                        <option value="لا حول ولا قوة إلا بالله">لا حَوْلَ وَلا قُوَّةَ إِلا بِاللَّهِ</option>
                        <option value="اللهم صلِ وسلم على نبينا محمد">اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ</option>
                        <option value="custom">ذكر مخصص...</option>
                    </select>
                </div>

                <div id="custom-thikr-input-box" class="hidden w-full mb-4">
                    <input type="text" id="custom-thikr-text" placeholder="اكتب الذكر هنا..." class="w-full p-2.5 bg-slate-100 dark:bg-slate-700 rounded-xl border border-slate-300 dark:border-slate-600 text-sm focus:outline-none">
                </div>

                <!-- Display Big Target & Phrase -->
                <p id="tasbeeh-phrase" class="thikr-font text-2xl font-bold text-emerald-700 dark:text-emerald-400 min-h-[60px] flex items-center justify-center">
                    سُبْحَانَ اللَّهِ
                </p>

                <!-- Digital Counter Circular Button -->
                <div class="my-8 relative flex items-center justify-center">
                    <!-- Outer Decorative Glow Ring -->
                    <div class="w-56 h-56 rounded-full bg-emerald-500/10 dark:bg-emerald-500/5 absolute pulse-animation"></div>
                    
                    <button id="tasbeeh-btn" onclick="incrementTasbeeh()" class="relative w-48 h-48 rounded-full bg-gradient-to-br from-emerald-500 to-emerald-700 hover:from-emerald-600 hover:to-emerald-800 text-white shadow-2xl shadow-emerald-600/40 flex flex-col items-center justify-center transform active:scale-95 transition duration-150 border-4 border-emerald-300/30">
                        <span id="tasbeeh-count-display" class="text-5xl font-black tracking-wider">0</span>
                        <span class="text-xs mt-1 text-emerald-100 font-medium">اضغط للتسبيح</span>
                    </button>
                </div>

                <!-- Controls Below Counter -->
                <div class="flex items-center justify-between w-full px-4 pt-4 border-t border-slate-100 dark:border-slate-700">
                    <div class="text-right">
                        <span class="text-xs text-slate-400 block">المجموع الكلي</span>
                        <span id="tasbeeh-total-sum" class="text-sm font-bold text-slate-700 dark:text-slate-300">0</span>
                    </div>

                    <button onclick="resetTasbeeh()" class="px-4 py-2 bg-rose-50 dark:bg-rose-900/20 text-rose-600 rounded-xl text-xs font-bold hover:bg-rose-100 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-rotate-left"></i> تصفير
                    </button>
                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-auto py-6 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500 dark:text-slate-400">
        <p>تطبيق الأذكار - صدقة جارية لجميع المسلمين والمسلمات</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Database of Athkar
        const ATHKAR_DATA = {
            morning: [
                { id: "m1", text: "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ: {اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ}", maxCount: 1, fadl: "من قالها حين يصبح أُجير من الجن حتى يمسي" },
                { id: "m2", text: "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ: {قُلْ هُوَ اللَّهُ أَحَدٌ...}، {قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ...}، {قُلْ أَعُوذُ بِرَبِّ النَّاسِ...}", maxCount: 3, fadl: "من قالها ثلاث مرات حين يصبح وثلاث حين يمسي كفته من كل شيء" },
                { id: "m3", text: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", maxCount: 1, fadl: "الدعاء ببركة اليوم والوقاية من الشرور" },
                { id: "m4", text: "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ", maxCount: 1, fadl: "شكر الله على نعمة الإصباح والنعمة" },
                { id: "m5", text: "اللَّهُمَّ أَنْتَ رَبِّي لاَ إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ", maxCount: 1, fadl: "سيد الاستغفار: من قالها موقناً بها ومات من يومه دخل الجنة" },
                { id: "m6", text: "اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلاَئِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لاَ إِلَهَ إِلاَّ أَنْتَ وَحْدَكَ لاَ شَرِيكَ لَكَ، وَأَنَّ مُحَمَّداً عَبْدُكَ وَرَسُولُكَ", maxCount: 4, fadl: "من قالها أعتقه الله من النار" },
                { id: "m7", text: "بِسْمِ اللَّهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الأَرْضِ وَلاَ فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", maxCount: 3, fadl: "لم يضره من الله شيء في ذلك اليوم" },
                { id: "m8", text: "رَضِيتُ بِاللَّهِ رَبّاً، وَبِالإِسْلاَمِ دِيناً، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيّاً", maxCount: 3, fadl: "كان حقاً على الله أن يرضيه يوم القيامة" },
                { id: "m9", text: "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلاَ تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ", maxCount: 1, fadl: "صلاح الأحوال وتفويض الأمر لله" },

                { id: "e3", text: "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", maxCount: 1, fadl: "الثناء على الله والحفظ في الليلة" },

                { id: "e5", text: "اللَّهُمَّ أَنْتَ رَبِّي لاَ إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ", maxCount: 1, fadl: "سيد الاستغفار" },
                { id: "e6", text: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ", maxCount: 3, fadl: "من قالها لم تضره حمة أو شَر تلك الليلة" },
                { id: "e7", text: "اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لاَ إِلَهَ إِلاَّ أَنْتَ", maxCount: 3, fadl: "سؤال العافية في الجسد والرؤية" }
            ],
            after_prayer: [
                { id: "p1", text: "أَسْتَغْفِرُ اللَّهَ (ثَلاَثاً)، اللَّهُمَّ أَنْتَ السَّلاَمُ وَمِنْكَ السَّلاَمُ، تَبَارَكْتَ يَا ذَا الْجَلاَلِ وَالإِكْرَامِ", maxCount: 1, fadl: "بعد السلام مباشر من الصلاة" },
                { id: "p2", text: "لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لاَ مَانِعَ لِمَا أَعْطَيْتَ، وَلاَ مُعْطِيَ لِمَا مَنَعْتَ، وَلاَ يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ", maxCount: 1, fadl: "تقال عقب كل صلاة" },
                { id: "p3", text: "سُبْحَانَ اللَّهِ (33)، الْحَمْدُ لِلَّهِ (33)، اللَّهُ أَكْبَرُ (33)", maxCount: 33, fadl: "تُمحى الخطايا وإن كانت مثل زبد البحر" },
                { id: "p4", text: "لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ (تمام المائة)", maxCount: 1, fadl: "تمام المائة بعد التسبيح والتحميد والتكبير" },
                { id: "p5", text: "قراءة آية الكرسي والمعوذات (الإخلاص، الفلق، الناس)", maxCount: 1, fadl: "من قرأ آية الكرسي دبر كل صلاة لم يمنعه من دخول الجنة إلا أن يموت" }
            ],
            sleep: [
                { id: "s1", text: "بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا، بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ", maxCount: 1, fadl: "الحفظ والأمان عند النوم" },
                { id: "s2", text: "اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ", maxCount: 3, fadl: "كان الرسول ﷺ يضع يده تحت خده الأيمن ويقولها" },
                { id: "s3", text: "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", maxCount: 1, fadl: "ذكر النوم المأثور" },
                { id: "s4", text: "سُبْحَانَ اللَّهِ (33)، وَالْحَمْدُ لِلَّهِ (33)، وَاللَّهُ أَكْبَرُ (34)", maxCount: 1, fadl: "خير للمسلم من خادم" }
            ],
            wake: [
                { id: "w1", text: "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", maxCount: 1, fadl: "شكر الله على نعمة الحياة بعد النوم" },
                { id: "w2", text: "الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي فِي جَسَدِي، وَرَدَّ عَلَيَّ رُوحِي، وَأَذِنَ لِي بِذِكْرِهِ", maxCount: 1, fadl: "حمد الله على العافية والذكر" }
            ]
        };

        // App State
        let currentCategory = 'morning';
        let countsState = {}; // Stores user progress per Thikr ID
        let favoritesList = [];
        let isSoundEnabled = true;
        let fontSizePx = 22;
        let tasbeehCount = 0;
        let tasbeehTotal = 0;

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            loadLocalStorage();
            applyTheme();
            renderCategory();
            updateTasbeehUI();
        });

        // Local Storage Helper
        function loadLocalStorage() {
            const savedCounts = localStorage.getItem('athkar_counts');
            if (savedCounts) countsState = JSON.parse(savedCounts);

            const savedFavs = localStorage.getItem('athkar_favs');
            if (savedFavs) favoritesList = JSON.parse(savedFavs);

            const savedSound = localStorage.getItem('athkar_sound');
            if (savedSound !== null) isSoundEnabled = JSON.parse(savedSound);
            updateSoundIcon();

            const savedFont = localStorage.getItem('athkar_fontsize');
            if (savedFont) {
                fontSizePx = parseInt(savedFont);
                document.getElementById('font-slider').value = fontSizePx;
            }

            const savedTasbeehTotal = localStorage.getItem('tasbeeh_total');
            if (savedTasbeehTotal) tasbeehTotal = parseInt(savedTasbeehTotal);
            document.getElementById('tasbeeh-total-sum').innerText = tasbeehTotal.toLocaleString('ar-EG');
        }

        function saveState() {
            localStorage.setItem('athkar_counts', JSON.stringify(countsState));
            localStorage.setItem('athkar_favs', JSON.stringify(favoritesList));
            localStorage.setItem('tasbeeh_total', tasbeehTotal.toString());
        }

        // Switch Category Tabs
        function switchCategory(cat) {
            currentCategory = cat;
            
            // Highlight Tab Buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 whitespace-nowrap transition shadow-sm bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700";
            });

            const activeBtn = document.getElementById(`tab-${cat}`);
            if (activeBtn) {
                activeBtn.className = "tab-btn active px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 whitespace-nowrap transition shadow-sm bg-emerald-600 text-white";
            }

            // Reset Search Input
            document.getElementById('search-input').value = '';
            document.getElementById('clear-search').classList.add('hidden');

            // Handle UI Views
            const headerInfo = document.getElementById('category-header-info');
            const athkarContainer = document.getElementById('athkar-container');
            const tasbeehContainer = document.getElementById('tasbeeh-container');

            if (cat === 'tasbeeh') {
                headerInfo.classList.add('hidden');
                athkarContainer.classList.add('hidden');
                tasbeehContainer.classList.remove('hidden');
            } else {
                headerInfo.classList.remove('hidden');
                athkarContainer.classList.remove('hidden');
                tasbeehContainer.classList.add('hidden');
                renderCategory();
            }
        }

        // Get Category Data List
        function getCurrentList() {
            if (currentCategory === 'favorites') {
                let all = [];
                Object.keys(ATHKAR_DATA).forEach(k => all = all.concat(ATHKAR_DATA[k]));
                return all.filter(item => favoritesList.includes(item.id));
            }
            return ATHKAR_DATA[currentCategory] || [];
        }

        // Render Current Athkar List
        function renderCategory(filterQuery = '') {
            const container = document.getElementById('athkar-container');
            container.innerHTML = '';

            // Set Title
            const titleMap = {
                morning: 'أذكار الصباح',
                evening: 'أذكار المساء',
                after_prayer: 'أذكار الصلاة',
                sleep: 'أذكار النوم',
                wake: 'أذكار الاستيقاظ',
                favorites: 'الأذكار المفضلة'
            };
            document.getElementById('category-title').innerText = titleMap[currentCategory] || 'الأذكار';

            let list = getCurrentList();

            if (filterQuery.trim() !== '') {
                const query = filterQuery.trim().toLowerCase();
                list = list.filter(item => item.text.toLowerCase().includes(query) || (item.fadl && item.fadl.toLowerCase().includes(query)));
            }

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-box-open text-4xl mb-3 block"></i>
                        <p class="text-sm">لا توجد أذكار لعرضها هنا</p>
                    </div>
                `;
                updateProgressBar(0, 0);
                return;
            }

            let completedCount = 0;

            list.forEach((item) => {
                const currentCount = countsState[item.id] !== undefined ? countsState[item.id] : item.maxCount;
                const isDone = currentCount === 0;
                if (isDone) completedCount++;

                const isFav = favoritesList.includes(item.id);

                const card = document.createElement('div');
                card.className = `bg-white dark:bg-slate-800 rounded-2xl p-5 border transition-all duration-200 shadow-sm relative overflow-hidden flex flex-col justify-between ${isDone ? 'card-completed' : 'border-slate-200 dark:border-slate-700'}`;

                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3 mb-3">
                        <button onclick="toggleFavorite('${item.id}')" class="text-slate-300 dark:text-slate-600 hover:text-amber-400 transition text-lg p-1">
                            <i class="${isFav ? 'fa-solid text-amber-400' : 'fa-regular'} fa-star"></i>
                        </button>

                        <div class="flex items-center gap-2">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300">
                                التكرار: ${item.maxCount}
                            </span>
                        </div>
                    </div>

                    <!-- Thikr Text -->
                    <div class="my-2 cursor-pointer" onclick="decrementCount('${item.id}', ${item.maxCount})">
                        <p class="thikr-font font-bold text-slate-800 dark:text-slate-100 text-right leading-relaxed" style="font-size: ${fontSizePx}px">
                            ${item.text}
                        </p>
                    </div>

                    <!-- Virtue / Fadl -->
                    ${item.fadl ? `
                        <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-700/50 text-xs text-slate-500 dark:text-slate-400 flex items-start gap-1.5">
                            <i class="fa-solid fa-circle-info text-emerald-600 dark:text-emerald-400 mt-0.5"></i>
                            <span>${item.fadl}</span>
                        </div>
                    ` : ''}

                    <!-- Bottom Action Controls -->
                    <div class="mt-4 pt-3 flex items-center justify-between gap-2 border-t border-slate-100 dark:border-slate-700/50">
                        <button onclick="copyThikr('${item.text.replace(/'/g, "\\'")}')" class="text-xs text-slate-400 hover:text-emerald-600 transition flex items-center gap-1">
                            <i class="fa-regular fa-copy"></i> نسخ
                        </button>

                        <div class="flex items-center gap-2">
                            <button onclick="resetSingleCount('${item.id}', ${item.maxCount})" class="p-2 text-slate-400 hover:text-rose-500 transition text-xs" title="إعادة الذكر">
                                <i class="fa-solid fa-rotate-left"></i>
                            </button>
                            <button id="counter-btn-${item.id}" onclick="decrementCount('${item.id}', ${item.maxCount})" 
                                class="px-5 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2 ${isDone ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300' : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-md shadow-emerald-600/20 active:scale-95'}">
                                <span>${isDone ? 'تم المـحـد' : 'المتبقي'}</span>
                                <span class="bg-white/20 px-2 py-0.5 rounded-md text-xs">${currentCount}</span>
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            updateProgressBar(completedCount, list.length);
        }

        // Decrement Counter per Thikr
        function decrementCount(id, max) {
            let current = countsState[id] !== undefined ? countsState[id] : max;
            if (current > 0) {
                current--;
                countsState[id] = current;
                saveState();
                playClickSound();
                triggerVibration();
                renderCategory(document.getElementById('search-input').value);
            }
        }

        // Reset Single Thikr Count
        function resetSingleCount(id, max) {
            countsState[id] = max;
            saveState();
            renderCategory(document.getElementById('search-input').value);
        }

        // Reset Current Category
        function resetCurrentCategory() {
            const list = getCurrentList();
            list.forEach(item => {
                countsState[item.id] = item.maxCount;
            });
            saveState();
            renderCategory();
        }

        // Favorites Handler
        function toggleFavorite(id) {
            const idx = favoritesList.indexOf(id);
            if (idx > -1) {
                favoritesList.splice(idx, 1);
            } else {
                favoritesList.push(id);
            }
            saveState();
            renderCategory(document.getElementById('search-input').value);
        }

        // Update Progress Bar UI
        function updateProgressBar(completed, total) {
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${completed} / ${total} المكتمل (${percentage}%)`;
        }

        // Electronic Tasbeeh Logic
        function changeTasbeehPreset(val) {
            const customBox = document.getElementById('custom-thikr-input-box');
            const phraseDisplay = document.getElementById('tasbeeh-phrase');

            if (val === 'custom') {
                customBox.classList.remove('hidden');
                const customInput = document.getElementById('custom-thikr-text');
                phraseDisplay.innerText = customInput.value || 'ذكر مخصص';
                customInput.oninput = (e) => {
                    phraseDisplay.innerText = e.target.value || 'ذكر مخصص';
                };
            } else {
                customBox.classList.add('hidden');
                phraseDisplay.innerText = val;
            }
            tasbeehCount = 0;
            updateTasbeehUI();
        }

        function incrementTasbeeh() {
            tasbeehCount++;
            tasbeehTotal++;
            saveState();
            playClickSound();
            triggerVibration();
            updateTasbeehUI();
        }

        function resetTasbeeh() {
            tasbeehCount = 0;
            updateTasbeehUI();
        }

        function updateTasbeehUI() {
            document.getElementById('tasbeeh-count-display').innerText = tasbeehCount.toLocaleString('ar-EG');
            document.getElementById('tasbeeh-total-sum').innerText = tasbeehTotal.toLocaleString('ar-EG');
        }

        // Copy Text Helper
        function copyThikr(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('تم نسخ الذكر بنجاح');
            });
        }

        // Search Input Handling
        function handleSearch(val) {
            const clearBtn = document.getElementById('clear-search');
            if (val.trim() !== '') {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderCategory(val);
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            document.getElementById('clear-search').classList.add('hidden');
            renderCategory();
        }

        // Sound / Audio API Feedback
        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            localStorage.setItem('athkar_sound', JSON.stringify(isSoundEnabled));
            updateSoundIcon();
        }

        function updateSoundIcon() {
            const icon = document.getElementById('sound-icon');
            if (isSoundEnabled) {
                icon.className = "fa-solid fa-volume-high text-emerald-600";
            } else {
                icon.className = "fa-solid fa-volume-xmark text-slate-400";
            }
        }

        function playClickSound() {
            if (!isSoundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
        }

        function triggerVibration() {
            if (navigator.vibrate) {
                navigator.vibrate(35);
            }
        }

        // Dark Mode Toggle
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('athkar_theme', 'light');
                icon.className = 'fa-solid fa-moon';
            } else {
                html.classList.add('dark');
                localStorage.setItem('athkar_theme', 'dark');
                icon.className = 'fa-solid fa-sun text-amber-400';
            }
        }

        function applyTheme() {
            const theme = localStorage.getItem('athkar_theme');
            const icon = document.getElementById('theme-icon');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                icon.className = 'fa-solid fa-sun text-amber-400';
            } else {
                document.documentElement.classList.remove('dark');
                icon.className = 'fa-solid fa-moon';
            }
        }

        // Font Size Adjuster Modal
        function toggleFontSizeModal() {
            document.getElementById('font-modal').classList.toggle('hidden');
        }

        function changeFontSize(val) {
            fontSizePx = val;
            localStorage.setItem('athkar_fontsize', val);
            document.getElementById('font-preview').style.fontSize = `${val}px`;
            renderCategory(document.getElementById('search-input').value);
        }

        // Simple Toast Notification
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-4 py-2 rounded-xl text-xs z-50 shadow-lg backdrop-blur-sm transition-all duration-300';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
    </script>
</body>
</html>
